<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotsa manualstöd för medicinteknik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Lotsa. Layoutidé: fast navigering till vänster, arbetsytan i mitten och manualsidan som papper bredvid svaret. */
  --sea:#0d2b33;      /* text och mörka ytor */
  --petrol:#12707a;   /* varumärke och interaktion */
  --mist:#f1f5f5;     /* bakgrund */
  --paper:#fbf6e9;    /* manualsida */
  --marker:#ffd966;   /* överstrykning av citat ur manualen */
  --beacon:#f0ad2e;   /* fyrljus: logotyp och nattläge */
  --font-display:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:var(--font-display);
  --font-code:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  --bg:var(--mist); --surface:#fff; --surface-2:#e8eeee; --surface-3:#dbe5e5;
  --ink:var(--sea); --ink-2:#3e5962; --ink-3:#5a747c;
  --line:#d3dddd; --line-2:#b4c3c4;
  --brand:var(--petrol); --brand-strong:#0b5560; --brand-ink:#fff; --brand-soft:#dcedee;
  --focus:#0b5560;
  --paper-ink:#2b2a22; --paper-line:#e6dcc0; --marker-ink:#2b2a22;
  --good:#1c7a4a; --good-soft:#def1e6; --warn:#9a4a06; --warn-soft:#fcecd9; --crit:#b3261e; --crit-soft:#fbe4e1; --crit-ink:#fff; --info-soft:#e3eef7;
  --tip-bg:#fff6d6; --tip-line:#dcc05f; --tip-ink:#3b3211;
  --prio-high:#c62828; --prio-med:#f2c200; --prio-low:#17a2bd;
  --shadow:0 12px 32px rgba(13,43,51,.16),0 2px 6px rgba(13,43,51,.08);
  --scrim:rgba(13,43,51,.45);
  --viz-1:#008fa1; --viz-2:#e8703a; --viz-3:#6250d6; --viz-4:#b5407f; --viz-mute:#c5d0d2; --viz-grid:#e3eaea; --viz-axis:#b4c3c4;
  --seq-1:#dcf0f2; --seq-2:#a9d9df; --seq-3:#6cbcc7; --seq-4:#1c8594; --seq-5:#0a5e6b; --seq-ink-a:#0d2b33; --seq-ink-b:#fff;
  --r-s:6px; --r-m:10px; --r-l:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1719; --surface:#122226; --surface-2:#192d32; --surface-3:#21383e;
    --ink:#e4eeee; --ink-2:#a9bdc1; --ink-3:#8ba2a7;
    --line:#273d42; --line-2:#3a5258;
    --brand:#58c0ca; --brand-strong:#7fd3dc; --brand-ink:#05292e; --brand-soft:#173a40;
    --focus:#7fd3dc;
    --paper:#231f14; --paper-ink:#ebe3cc; --paper-line:#3a3423; --marker:#7a5f0c; --marker-ink:#fff6d6;
    --good:#62c491; --good-soft:#163526; --warn:#f0a35a; --warn-soft:#3a2613; --crit:#f28b82; --crit-soft:#431b1b; --crit-ink:#2b0a08; --info-soft:#17303f;
    --tip-bg:#2c2710; --tip-line:#6e5f1e; --tip-ink:#f1e6b8;
    --prio-high:#ef5350; --prio-med:#f2c200; --prio-low:#35bcd4;
    --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
    --viz-1:#29a3b3; --viz-2:#d95926; --viz-3:#9085e9; --viz-4:#d55181; --viz-mute:#3a4c50; --viz-grid:#22363b; --viz-axis:#3a5258;
    --seq-1:#17393f; --seq-2:#1c525b; --seq-3:#23717d; --seq-4:#3fa3b1; --seq-5:#7fcdd7; --seq-ink-a:#e4eeee; --seq-ink-b:#05292e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1719; --surface:#122226; --surface-2:#192d32; --surface-3:#21383e;
  --ink:#e4eeee; --ink-2:#a9bdc1; --ink-3:#8ba2a7;
  --line:#273d42; --line-2:#3a5258;
  --brand:#58c0ca; --brand-strong:#7fd3dc; --brand-ink:#05292e; --brand-soft:#173a40;
  --focus:#7fd3dc;
  --paper:#231f14; --paper-ink:#ebe3cc; --paper-line:#3a3423; --marker:#7a5f0c; --marker-ink:#fff6d6;
  --good:#62c491; --good-soft:#163526; --warn:#f0a35a; --warn-soft:#3a2613; --crit:#f28b82; --crit-soft:#431b1b; --crit-ink:#2b0a08; --info-soft:#17303f;
  --tip-bg:#2c2710; --tip-line:#6e5f1e; --tip-ink:#f1e6b8;
  --prio-high:#ef5350; --prio-med:#f2c200; --prio-low:#35bcd4;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  --viz-1:#29a3b3; --viz-2:#d95926; --viz-3:#9085e9; --viz-4:#d55181; --viz-mute:#3a4c50; --viz-grid:#22363b; --viz-axis:#3a5258;
  --seq-1:#17393f; --seq-2:#1c525b; --seq-3:#23717d; --seq-4:#3fa3b1; --seq-5:#7fcdd7; --seq-ink-a:#e4eeee; --seq-ink-b:#05292e;
}
/* Nattläge: dämpat, varmt och med lite blått ljus. Väljs i appen och gäller oavsett tema. */
:root.night,:root.night[data-theme]{
  color-scheme:dark;
  --bg:#08090a; --surface:#111314; --surface-2:#191c1d; --surface-3:#232728;
  --ink:#ecdfc6; --ink-2:#b8ab92; --ink-3:#93886f;
  --line:#2a2824; --line-2:#3d3a33;
  --brand:#eaae45; --brand-strong:#f4c66f; --brand-ink:#1b1203; --brand-soft:#2b210d;
  --focus:#f4c66f;
  --paper:#1c1a13; --paper-ink:#e8dcc0; --paper-line:#34301f; --marker:#6b540b; --marker-ink:#fff3cf;
  --good:#86c79e; --good-soft:#152a1d; --warn:#e9a35a; --warn-soft:#33220f; --crit:#ee7d72; --crit-soft:#3a1715; --crit-ink:#2b0a08; --info-soft:#1b2226;
  --tip-bg:#2a240f; --tip-line:#5e521c; --tip-ink:#efe2b0;
  --prio-high:#ef5350; --prio-med:#f2c200; --prio-low:#35bcd4;
  --shadow:0 12px 32px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.72);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.2;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
a{color:var(--brand);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ol,ul{margin:0;padding-left:1.4em}
img,svg{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-s{width:16px;height:16px}
.ic-l{width:28px;height:28px}
.ic-xl{width:40px;height:40px;stroke-width:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--font-code);font-weight:700;letter-spacing:.01em}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.nowrap{white-space:nowrap}

/* ---------- Skal ---------- */
.app{height:100%;display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:20px;padding:20px 14px 16px;background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;color:var(--ink);text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font:800 23px/1 var(--font-display);letter-spacing:-.03em}
.brand-tag{display:block;font:400 12.5px/1.25 var(--font-body);color:var(--ink-3);letter-spacing:0;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font:700 13px/1 var(--font-body);color:var(--ink-3);padding:16px 10px 8px}
.nav a,.nav button{display:flex;align-items:center;gap:11px;min-height:42px;padding:8px 10px;border:0;border-radius:var(--r-m);background:none;color:var(--ink-2);text-decoration:none;font-weight:500;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav a.is-on{background:var(--brand-soft);color:var(--brand-strong);font-weight:700}
.nav .count{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--crit);color:var(--crit-ink);font:700 12.5px/1.5 var(--font-body);text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.role{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--bg)}
.role-label{font-size:13px;color:var(--ink-3)}
.topbar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .brand{padding:0}
.topbar .brand svg{width:30px;height:30px}
.topbar .brand-name{font-size:21px}
.topbar .sp{flex:1}
.main{overflow:auto;min-width:0;outline:none;scroll-padding-top:16px}
.view{max-width:1120px;padding:28px 32px 72px}
.view.narrow{max-width:820px}
.tabbar{display:none;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 6px}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:6px 2px;border:0;background:none;color:var(--ink-3);text-decoration:none;font:500 12.5px/1.2 var(--font-body);border-radius:var(--r-m)}
.tabbar .is-on{color:var(--brand-strong);font-weight:700}
.tabbar .is-on .ic{stroke-width:2.2}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .rail{display:none}
  .topbar{display:flex}
  .tabbar{display:grid}
  .view{padding:18px 16px 40px}
}
.night .rail,.night .topbar,.night .tabbar{display:none}
.night .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

/* ---------- Rubriker och sidhuvud ---------- */
.h1{font-size:30px;font-weight:800;letter-spacing:-.025em}
.h2{font-size:20px;font-weight:700}
.h3{font-size:16.5px;font-weight:700}
.lead{font-size:18px;color:var(--ink-2);max-width:62ch}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:20px}
.page-head .h1{margin-right:auto}
.page-sub{color:var(--ink-2);max-width:68ch;margin:-10px 0 20px}
.sect{margin-top:32px}
.sect-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sect-head .h2{margin-right:auto}
.stack{display:flex;flex-direction:column;gap:12px}
.rowflex{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
@media (max-width:899px){.h1{font-size:25px}.lead{font-size:17px}}

/* ---------- Knappar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-quiet{border-color:transparent;background:none;color:var(--brand-strong);padding-left:10px;padding-right:10px}
.btn-quiet:hover{background:var(--brand-soft)}
.btn-danger{border-color:var(--crit);color:var(--crit)}
.btn-danger:hover{background:var(--crit-soft)}
.btn-crit{background:var(--crit);border-color:var(--crit);color:var(--crit-ink)}
.btn-s{min-height:36px;padding:6px 12px;font-size:14.5px;border-radius:8px}
.btn-lg{min-height:54px;padding:12px 22px;font-size:17.5px}
.btn-icon{width:44px;padding:0}
.btn-icon.btn-s{width:36px}
.btn-block{width:100%}
.btn.is-on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);padding:3px;gap:3px}
.seg button{min-height:36px;padding:5px 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:14.5px;white-space:nowrap}
.seg button.is-on{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:15px}
.chip:hover{border-color:var(--brand)}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-weight:400;opacity:.75}
.star{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--ink-3)}
.star:hover{background:var(--surface-2)}
.star.is-on{color:var(--beacon)}
.star.is-on .ic{fill:currentColor}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ---------- Formulär ---------- */
.field{display:grid;gap:5px}
.field>label,.label{font-weight:600;font-size:15px}
.hint{font-size:14px;color:var(--ink-3)}
.input,.select,.textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);color:var(--ink)}
.textarea{min-height:88px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{outline:3px solid var(--focus);outline-offset:1px}
.input::placeholder,.textarea::placeholder{color:var(--ink-3);opacity:1}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.formgrid .full{grid-column:1/-1}
@media (max-width:560px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.searchbox{position:relative;flex:1;min-width:200px}
.searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.searchbox .input{padding-left:42px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.switch{display:flex;align-items:center;gap:12px}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- Märken och meddelanden ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 13px/1.5 var(--font-body);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge .ic{width:14px;height:14px;stroke-width:2.2}
.b-ok{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-crit{background:var(--crit-soft);color:var(--crit)}
.b-brand{background:var(--brand-soft);color:var(--brand-strong)}
.b-demo{background:none;border:1px dashed var(--line-2);color:var(--ink-3)}
.notice{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--info-soft);color:var(--ink);border-left:4px solid var(--brand)}
.notice .ic{margin-top:2px;color:var(--brand-strong)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.warn .ic{color:var(--warn)}
.notice.crit{background:var(--crit-soft);border-color:var(--crit)}
.notice.crit .ic{color:var(--crit)}
.notice.ok{background:var(--good-soft);border-color:var(--good)}
.notice.ok .ic{color:var(--good)}
.notice strong{display:block}
.notice .btn{margin-top:8px}
.empty{padding:28px 20px;border:1px dashed var(--line-2);border-radius:var(--r-l);text-align:left;color:var(--ink-2);display:grid;gap:10px;justify-items:start}
.empty .h3{color:var(--ink)}
.phi{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink-3)}
.phi .ic{width:16px;height:16px;margin-top:3px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 14px;background:var(--warn-soft);color:var(--ink);font-size:14.5px;border-bottom:1px solid var(--line)}
.banner .ic{color:var(--warn)}

/* ---------- Ytor och listor ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.panel-h .h3,.panel-h .h2{margin-right:auto}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-main strong{font-weight:700}
.row-sub{color:var(--ink-2);font-size:14.5px}
.row-meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.row.stack-s{align-items:flex-start}
@media (max-width:640px){.row.wrap-s{flex-wrap:wrap}.row.wrap-s .row-meta{justify-content:flex-start;width:100%;padding-left:58px}}
.stretch{position:absolute;inset:0;border-radius:inherit}
.above{position:relative;z-index:1}
.devic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);flex:none}
.devic.lg{width:60px;height:60px;border-radius:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);transition:border-color .12s}
.tile:hover{border-color:var(--brand)}
.tile-name{font-weight:700;font-size:17px;line-height:1.25;color:var(--ink);text-decoration:none}
.tile-sub{display:block;color:var(--ink-2);font-size:14.5px;margin-top:2px}
.tile-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{font-weight:700;text-align:left;font-size:13.5px;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.table td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table td.q{min-width:220px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.is-on{color:var(--brand-strong);border-bottom-color:var(--brand)}
.tabs .count{padding:0 7px;border-radius:99px;background:var(--surface-3);font-size:13px;color:var(--ink-2)}
.tabs .count.hot{background:var(--crit);color:var(--crit-ink)}
.skel{border-radius:var(--r-l);background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:skel 1.4s linear infinite;min-height:74px}
@keyframes skel{to{background-position:-200% 0}}

/* ---------- Hem ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center;padding:18px 20px;margin-bottom:26px;background:var(--ink);color:var(--bg);border-radius:var(--r-l)}
.intro .h2{font-size:21px}
.intro p{opacity:.86;max-width:60ch;margin-top:4px}
.intro .btn{border-color:transparent}
.intro .btn-quiet{color:var(--bg);text-decoration:underline;text-underline-offset:3px}
.intro .btn-quiet:hover{background:rgba(255,255,255,.12)}
.intro .btn-primary{background:var(--beacon);color:#1b1203}
.intro .btn-primary:hover{background:#ffc552}
@media (max-width:720px){.intro{grid-template-columns:minmax(0,1fr)}}
.omni{position:relative;margin:16px 0 14px}
.omni-box{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;background:var(--surface);border:2px solid var(--brand);border-radius:16px}
.omni-box .ic{color:var(--brand-strong)}
.omni-box input{flex:1;min-width:0;min-height:48px;border:0;background:none;font-size:18px;outline:none}
.omni-box input::placeholder{color:var(--ink-3);opacity:1}
.omni-sug{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.omni-sug button,.omni-sug a{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:9px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;text-decoration:none}
.omni-sug>:first-child{border-top:0}
.omni-sug button:hover,.omni-sug a:hover{background:var(--brand-soft)}
.omni-sug .ic{color:var(--brand-strong)}
.omni-sug .sub{color:var(--ink-3);font-size:14px;margin-left:auto;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick a,.quick button{display:flex;align-items:center;gap:12px;min-height:66px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;text-align:left;line-height:1.2}
.quick a:hover,.quick button:hover{border-color:var(--brand)}
.quick .ic{color:var(--brand-strong)}
.quick small{display:block;font-weight:400;font-size:13.5px;color:var(--ink-3);margin-top:2px}
@media (max-width:900px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.todo a{display:grid;gap:2px;padding:14px 18px;color:var(--ink);text-decoration:none;border-left:1px solid var(--line)}
.todo a:first-child{border-left:0}
.todo a:hover{background:var(--brand-soft)}
.todo b{font-size:26px;line-height:1.1;font-weight:800}
.todo span{color:var(--ink-2);font-size:14.5px}
@media (max-width:640px){.todo a{border-left:0;border-top:1px solid var(--line)}.todo a:first-child{border-top:0}}

/* ---------- Enhetssida ---------- */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:15px;margin-bottom:12px}
.back:hover{color:var(--brand-strong)}
.dev-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.dev-head .h1{font-size:27px}
.dev-sub{color:var(--ink-2)}
.dev-actions{display:flex;gap:8px;align-items:center}
.dev-facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:640px){.dev-head{grid-template-columns:auto minmax(0,1fr)}.dev-actions{grid-column:1/-1;justify-content:flex-start}.dev-head .h1{font-size:23px}}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.contact{display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.contact .tel{font:700 21px/1.2 var(--font-code);color:var(--ink);text-decoration:none}
.contact .tel:hover{color:var(--brand-strong)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}

/* ---------- Chatt ---------- */
.chat{display:flex;flex-direction:column;gap:16px;max-width:820px}
.chat-log{display:flex;flex-direction:column;gap:18px}
.chat-empty{display:grid;gap:14px;padding:6px 0}
.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shortcut{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--surface);font-weight:700;text-align:left;line-height:1.2}
.shortcut:hover{border-color:var(--brand);background:var(--brand-soft)}
.shortcut .ic{color:var(--brand-strong)}
@media (max-width:560px){.shortcuts{grid-template-columns:minmax(0,1fr)}.shortcut{min-height:50px}}
.msg-q{align-self:flex-end;max-width:85%;padding:10px 16px;border-radius:18px 18px 4px 18px;background:var(--brand);color:var(--brand-ink);font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-a{display:grid;gap:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;overflow-wrap:anywhere}
.a-status{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.a-status.saknas{color:var(--warn)}
.a-status.avvisad{color:var(--crit)}
.a-body{display:grid;gap:10px;font-size:16.5px;max-width:68ch}
.a-body ol,.a-body ul{display:grid;gap:7px}
.a-body ol{list-style:none;padding:0;counter-reset:steg}
.a-body ol>li{position:relative;padding-left:40px;counter-increment:steg;min-height:28px}
.a-body ol>li::before{content:counter(steg);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);font:700 15px/28px var(--font-body);text-align:center}
.cite{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin:0 2px;border:0;border-radius:6px;background:var(--marker);color:var(--marker-ink);font:700 13px/1 var(--font-body);vertical-align:2px}
.cite:hover{outline:2px solid var(--ink)}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:dot 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.sources{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sources-h{font-weight:700;font-size:14.5px;color:var(--ink-2)}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:3px;background:var(--paper);color:var(--paper-ink);text-align:left}
.src:hover{border-color:var(--ink-3)}
.src-n{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--marker);color:var(--marker-ink);font:700 13px/1 var(--font-body)}
.src-where{font-weight:700;font-size:15px}
.src-quote{grid-column:2/-1;font-size:14.5px;line-height:1.45}
.src-quote mark{background:var(--marker);color:var(--marker-ink);padding:1px 2px;border-radius:2px}
.src-check{font-size:13px;font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.src-check.ok{color:var(--good)}
.src-check.no{color:var(--warn)}
.src-check .ic{width:15px;height:15px;stroke-width:2.4}
.a-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--ink-3)}
.a-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.a-actions .sp{flex:1}
.mtcard{display:grid;gap:8px;padding:14px 16px;border-radius:var(--r-m);background:var(--crit-soft);border-left:4px solid var(--crit)}
.mtcard.soft{background:var(--warn-soft);border-color:var(--warn)}
.mtcard-h{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.mtcard-h .ic{color:var(--crit)}
.mtcard.soft .mtcard-h .ic{color:var(--warn)}
.mtcard .tel{font:700 20px/1.2 var(--font-code);color:var(--ink);text-decoration:none}
.mtcard-rows{display:grid;gap:6px}
.mtcard-row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.composer-wrap{position:sticky;bottom:0;display:grid;gap:8px;padding:10px 0 12px;background:linear-gradient(to bottom,transparent,var(--bg) 14px);z-index:2}
.composer{display:flex;align-items:flex-end;gap:6px;padding:6px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:16px}
.composer:focus-within{border-color:var(--brand)}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:160px;padding:10px 10px;border:0;background:none;resize:none;outline:none;line-height:1.4}
.composer textarea::placeholder{color:var(--ink-3);opacity:1}
.mic.is-live{background:var(--crit);border-color:var(--crit);color:var(--crit-ink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(198,40,40,.18)}}
.fallback-hit{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--paper-line);border-radius:3px;background:var(--paper);color:var(--paper-ink);text-align:left;width:100%}
.fallback-hit strong{font-size:15px}
.fallback-hit span{font-size:14.5px;line-height:1.45}

/* ---------- Manualsida (papper) ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:3px;padding:22px 24px;font-size:15.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 var(--paper-line),0 3px 0 -1px var(--paper),0 4px 0 -1px var(--paper-line)}
.paper mark{background:var(--marker);color:var(--marker-ink);padding:2px 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.paper-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:10px}
.paper-pager{display:flex;align-items:center;gap:8px;margin-top:12px}
.paper-pager .sp{flex:1}

/* ---------- Larm ---------- */
.alarm-form{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) auto;gap:10px;align-items:end}
.alarm-input{font:700 30px/1.1 var(--font-code);text-transform:uppercase;min-height:64px;text-align:center;letter-spacing:.04em}
.alarm-input::placeholder{font-weight:500;letter-spacing:0;text-transform:none;font-size:22px}
@media (max-width:640px){.alarm-form{grid-template-columns:minmax(0,1fr)}}
.codechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.codechip{min-height:40px;padding:6px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font:700 16px/1.2 var(--font-code)}
.codechip:hover{border-color:var(--brand);background:var(--brand-soft)}
.alarm-card{display:grid;gap:14px;padding:18px 20px 18px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);position:relative;overflow:hidden}
.alarm-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--line-2)}
.alarm-card.p-hog::before{background:var(--prio-high)}
.alarm-card.p-medel::before{background:var(--prio-med)}
.alarm-card.p-lag::before{background:var(--prio-low)}
.alarm-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.alarm-code{font:700 34px/1 var(--font-code);padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--bg);letter-spacing:.02em}
.alarm-label{font-weight:800;font-size:19px;line-height:1.2}
.prio{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.prio i{width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.prio.p-hog i{background:var(--prio-high)}
.prio.p-medel i{background:var(--prio-med)}
.prio.p-lag i{background:var(--prio-low)}
.alarm-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;margin:0;font-size:16.5px}
.alarm-dl dt{font-weight:700;color:var(--ink-2)}
.alarm-dl dd{margin:0}
.alarm-dl ol{display:grid;gap:6px;padding-left:1.3em}
@media (max-width:560px){.alarm-dl{grid-template-columns:minmax(0,1fr);gap:2px 0}.alarm-dl dd{margin-bottom:10px}.alarm-code{font-size:28px}}
.alarm-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.alarm-foot .sp{flex:1}
.regtable td:first-child{font:700 15.5px/1.4 var(--font-code);white-space:nowrap}

/* ---------- Snabbkort ---------- */
.qcard{background:var(--surface);border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;max-width:860px}
.qcard-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 18px;background:var(--ink);color:var(--bg)}
.qcard-head strong{font-size:19px;font-weight:800;margin-right:auto}
.qcard-head .badge{background:rgba(255,255,255,.16);color:inherit}
.qcard-head .badge.draft{background:var(--beacon);color:#1b1203}
.qcard-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.qsec{padding:14px 18px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.qsec:nth-child(odd){border-left:0}
.qsec:nth-child(-n+2){border-top:0}
.qsec h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:8px}
.qsec h3 .ic{color:var(--brand-strong)}
.qsec ol,.qsec ul{display:grid;gap:5px;font-size:15px;line-height:1.4}
.qsec table{width:100%;border-collapse:collapse;font-size:14.5px}
.qsec td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.qsec tr:first-child td{border-top:0}
.qsec td:first-child{font:700 14.5px/1.45 var(--font-code);white-space:nowrap}
.qsrc{display:inline-block;margin-top:8px;font-size:13px}
.qcard-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
@media (max-width:700px){.qcard-body{grid-template-columns:minmax(0,1fr)}.qsec{border-left:0}.qsec:nth-child(2){border-top:1px solid var(--line)}}

/* ---------- Lokala tips: som en tejpad lapp ---------- */
.tipnote{position:relative;display:grid;gap:6px;padding:20px 16px 12px;background:var(--tip-bg);color:var(--tip-ink);border:1px dashed var(--tip-line);border-radius:3px}
.tipnote::before{content:"";position:absolute;top:-7px;left:22px;width:74px;height:15px;background:var(--tip-line);opacity:.55;transform:rotate(-2deg);border-radius:1px}
.tip-label{font-weight:700;font-size:13.5px}
.tip-meta{font-size:13px;opacity:.8}
.tipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px 14px;padding-top:6px}

/* ---------- QR ---------- */
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.qr{width:168px;height:168px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.qr svg{display:block;width:100%;height:100%}
@media (max-width:560px){.qrbox{grid-template-columns:minmax(0,1fr)}}
.urlline{font:500 13.5px/1.4 var(--font-code);overflow-wrap:anywhere;color:var(--ink-2)}

/* ---------- Överlägg ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);animation:pop .16s}
.modal.wide{width:min(860px,100%)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.modal-h .h2{margin-right:auto;padding-top:6px}
.modal-b{padding:14px 20px 20px;display:grid;gap:14px}
.modal-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.drawer-scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:41;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h>div{margin-right:auto;min-width:0}
.drawer-b{flex:1;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:88%;border-radius:18px 18px 0 0;animation:rise .2s}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 12px 16px;box-shadow:var(--shadow);max-height:86%;overflow:auto;animation:rise .2s}
.sheet .nav a,.sheet .nav button{min-height:50px}
.toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(480px,calc(100% - 24px));pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-m);background:var(--ink);color:var(--bg);box-shadow:var(--shadow);animation:pop .16s;pointer-events:auto}
.toast.crit{background:var(--crit);color:var(--crit-ink)}
.toast .ic{margin-top:2px}

/* ---------- Steg för steg ---------- */
.steps{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;animation:fade .15s}
.steps-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.steps-h>div{margin-right:auto;min-width:0}
.steps-b{overflow:auto;display:grid;align-content:center;justify-items:start;gap:18px;padding:24px;max-width:900px;width:100%;margin:0 auto}
.steps-n{font:800 20px/1 var(--font-body);color:var(--brand-strong)}
.steps-t{font-size:clamp(24px,4.4vw,40px);font-weight:700;line-height:1.25;letter-spacing:-.015em;text-wrap:pretty}
.steps-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;padding:14px 18px 18px;border-top:1px solid var(--line);max-width:900px;width:100%;margin:0 auto}
.steps-f .btn{min-height:68px;font-size:20px}
.steps-dots{display:flex;gap:6px;flex-wrap:wrap}
.steps-dots i{width:26px;height:6px;border-radius:3px;background:var(--line-2)}
.steps-dots i.done{background:var(--brand)}

/* ---------- Nattläge ---------- */
.nview{max-width:900px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:18px}
.nhead{display:flex;align-items:center;gap:12px}
.nhead .h1{font-size:24px;margin-right:auto;display:flex;align-items:center;gap:10px}
.nhead .h1 .ic{color:var(--brand)}
.ndev{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border:1.5px solid var(--line-2);border-radius:18px;background:var(--surface);text-align:left}
.ndev strong{display:block;font-size:22px;line-height:1.2}
.ndev span{color:var(--ink-2)}
.ndev .chg{margin-left:auto;color:var(--brand);font-weight:700}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nbtn{display:grid;justify-items:start;align-content:space-between;gap:16px;min-height:150px;padding:20px;border:0;border-radius:20px;background:var(--brand);color:var(--brand-ink);font:800 24px/1.15 var(--font-display);text-align:left;letter-spacing:-.01em}
.nbtn:active{transform:scale(.985)}
.nbtn.alt{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}
.nbtn.is-on{outline:4px solid var(--ink);outline-offset:2px}
@media (max-width:640px){.ngrid{grid-template-columns:minmax(0,1fr)}.nbtn{min-height:92px;grid-auto-flow:column;align-content:center;align-items:center;justify-content:start;font-size:23px}}
.npick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.npick button{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 18px;border:1.5px solid var(--line-2);border-radius:18px;background:var(--surface);text-align:left;font-size:19px;font-weight:700;line-height:1.2}
.npick button span{display:block;font-size:15px;font-weight:400;color:var(--ink-2);margin-top:3px}
.nout{display:grid;gap:14px}
.nout .a-body{font-size:21px;line-height:1.45;max-width:none}
.nout .a-body ol>li{padding-left:52px;min-height:38px}
.nout .a-body ol>li::before{width:38px;height:38px;line-height:38px;font-size:19px}
.nout .alarm-dl{font-size:20px}
.nout .alarm-code{font-size:42px}
.ncall{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink);text-decoration:none}
.ncall strong{font:700 26px/1.1 var(--font-code)}
.ncall span{display:block;color:var(--ink-2)}
.ncall .ic{color:var(--brand)}
.night .alarm-input{min-height:84px;font-size:40px}
.night .input,.night .composer textarea{font-size:19px}
.night .codechip{min-height:56px;font-size:21px;padding:8px 20px}
.night .btn{min-height:54px;font-size:18px}
.night .btn-s{min-height:46px;font-size:16px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.kpi{display:grid;gap:4px;align-content:start;padding:16px 18px;border-left:1px solid var(--line);color:var(--ink);text-decoration:none;min-width:0}
.kpi:first-child{border-left:0}
a.kpi:hover{background:var(--brand-soft)}
.kpi-label{font-size:14px;color:var(--ink-2);line-height:1.3}
.kpi-value{font:800 34px/1.05 var(--font-body);letter-spacing:-.03em}
.kpi-value small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:3px;color:var(--ink-2)}
.kpi-sub{font-size:13.5px;color:var(--ink-3);line-height:1.35}
.kpi-sub.up{color:var(--good)}
.kpi.attn .kpi-value{color:var(--warn)}
.kpi svg{display:block;margin-top:4px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(odd){border-left:0}.kpi:nth-child(4){border-left:1px solid var(--line)}.kpi-value{font-size:28px}}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.dash>*{grid-column:span 6;min-width:0}
.dash>.w12{grid-column:1/-1}
.dash>.w7{grid-column:span 7}
.dash>.w5{grid-column:span 5}
@media (max-width:980px){.dash>*,.dash>.w7,.dash>.w5{grid-column:1/-1}}
.chart{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 14px;display:grid;gap:10px;align-content:start}
.chart-h{display:flex;align-items:flex-start;gap:10px}
.chart-h>div{margin-right:auto;min-width:0}
.chart-t{font:700 16.5px/1.25 var(--font-display)}
.chart-s{font-size:14px;color:var(--ink-2);margin-top:2px}
.chart-b{min-width:0}
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:500 12px var(--font-body);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.viz .val{fill:var(--ink);font-weight:700}
.viz .grid{stroke:var(--viz-grid);stroke-width:1}
.viz .axis{stroke:var(--viz-axis);stroke-width:1}
.viz .hit{fill:transparent;cursor:default}
.viz .mark{transition:opacity .1s}
.viz .hit:hover+.mark,.viz .hit:focus+.mark,.viz .mark.hov{opacity:.72}
.viz-tip{position:fixed;z-index:90;pointer-events:none;padding:8px 11px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.35;box-shadow:var(--shadow);max-width:260px}
.viz-tip b{display:block;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.segbar{display:flex;gap:2px;height:28px}
.segbar>div{display:flex;align-items:center;padding:0 8px;border-radius:4px;font:700 13.5px/1 var(--font-body);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.meter-name{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meter-name small{display:block;color:var(--ink-3);font-size:13px}
.meter-val{font-weight:700;font-variant-numeric:tabular-nums}
.meter-bar{grid-column:1/-1;height:8px;border-radius:0 4px 4px 0;background:var(--viz-1);min-width:2px}
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:14px}
.heat th{font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left;padding:4px 6px}
.heat thead th{text-align:center}
.heat td{text-align:center;padding:9px 4px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.heat .s0{background:var(--surface-2);color:var(--ink-3);font-weight:500}
.heat .s1{background:var(--seq-1);color:var(--seq-ink-a)}
.heat .s2{background:var(--seq-2);color:var(--seq-ink-a)}
.heat .s3{background:var(--seq-3);color:var(--seq-ink-a)}
.heat .s4{background:var(--seq-4);color:var(--seq-ink-b)}
.heat .s5{background:var(--seq-5);color:var(--seq-ink-b)}
.scale{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.scale i{width:22px;height:10px;border-radius:2px}
.assume{font-size:13.5px;color:var(--ink-3);margin-top:12px;max-width:80ch}

/* ---------- Uppladdning ---------- */
.drop{display:grid;gap:10px;justify-items:center;padding:30px 20px;border:2px dashed var(--line-2);border-radius:var(--r-l);text-align:center;background:var(--bg)}
.drop.is-over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{color:var(--brand-strong)}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .2s}
.wsteps{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);counter-reset:w}
.wsteps span{display:inline-flex;align-items:center;gap:6px;counter-increment:w}
.wsteps span::before{content:counter(w);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-3);font-weight:700;font-size:13px;color:var(--ink-2)}
.wsteps span.is-on{color:var(--ink);font-weight:700}
.wsteps span.is-on::before{background:var(--brand);color:var(--brand-ink)}
.filecard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg)}

/* ---------- Om tjänsten ---------- */
.about-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding:8px 0 8px}
.about-hero .h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em}
.about-hero .lead{margin-top:14px}
.about-hero .rowflex{margin-top:22px}
.about-demo{display:grid;gap:10px}
.about-demo .msg-q{font-size:15.5px}
.about-demo .msg-a{font-size:15px;padding:14px 16px}
.about-demo .a-body{font-size:15.5px}
@media (max-width:900px){.about-hero{grid-template-columns:minmax(0,1fr);gap:22px}}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.trio>div{padding:20px 22px;border-left:1px solid var(--line);display:grid;gap:8px;align-content:start}
.trio>div:first-child{border-left:0}
.trio .h3{font-size:18px}
.trio p{color:var(--ink-2)}
@media (max-width:800px){.trio{grid-template-columns:minmax(0,1fr)}.trio>div{border-left:0;border-top:1px solid var(--line)}.trio>div:first-child{border-top:0}}
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.proof b{display:block;font:800 38px/1 var(--font-body);letter-spacing:-.03em}
.proof span{color:var(--ink-2);display:block;margin-top:6px;max-width:30ch}
@media (max-width:700px){.proof{grid-template-columns:minmax(0,1fr)}}
.flow{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:f}
.flow li{counter-increment:f;display:grid;gap:6px;align-content:start;padding-top:14px;border-top:3px solid var(--brand)}
.flow li::before{content:counter(f);font:800 15px/1 var(--font-body);color:var(--brand-strong)}
.flow strong{font-size:16.5px}
.flow span{color:var(--ink-2);font-size:15px}
@media (max-width:860px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.flow{grid-template-columns:minmax(0,1fr)}}
.checks{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
.checks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.checks .ic{color:var(--good);margin-top:3px;stroke-width:2.4}
.checks strong{display:block}
.checks span{color:var(--ink-2);font-size:15px;grid-column:2}
@media (max-width:760px){.checks{grid-template-columns:minmax(0,1fr)}}
.featlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px 24px}
.feat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px}
.feat .ic{color:var(--brand-strong);margin-top:2px}
.feat span{grid-column:2;color:var(--ink-2);font-size:15px}

/* ---------- Rundtur ---------- */
.tour-hole{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 9999px var(--scrim);pointer-events:none;transition:all .25s ease}
.tour-block{position:fixed;inset:0;z-index:69}
.tour-pop{position:fixed;z-index:71;width:min(380px,calc(100% - 24px));background:var(--surface);color:var(--ink);border-radius:var(--r-l);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:10px;transition:top .25s ease,left .25s ease}
.tour-pop .h3{font-size:18px}
.tour-pop p{color:var(--ink-2)}
.tour-foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.tour-foot .sp{flex:1}
.tour-prog{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Hjälpklasser ---------- */
.sp{flex:1 1 auto}
.mt8{margin-top:8px}
.mt14{margin-top:14px}
.mt20{margin-top:20px}
.msg-a.bare{padding:0;border:0;background:none;border-radius:0}
.intro{position:relative;padding-right:56px}
.intro-x{position:absolute;top:8px;right:8px}
.dash-col{display:grid;gap:16px;align-content:start}
.dev-actions{flex-wrap:wrap}
.dev-actions .btn{white-space:nowrap}

</style>

<script>
/* Lotsa – inbyggd exempeldata.
   Allt här är fiktivt: tillverkare, produkter, telefonnummer och siffror.
   Exempeldatan visas direkt från sidan och skrivs aldrig till databasen;
   databasen innehåller bara det som läggs till eller ändras i appen. */
(function () {
  const P = (n, text) => ({ n, text: text.replace(/^\n+|\s+$/g, '') });

  /* ---------- 1. Infusionspump (svenska) ---------- */
  const flowPages = [
    P(1, `
Demovia Flow 300
Volymetrisk infusionspump
Bruksanvisning, Rev D

EXEMPELMANUAL. Produkten och tillverkaren är påhittade och texten är skriven för demonstration.

Innehåll
1 Avsedd användning och säkerhet, sida 2
2 Översikt, sida 3
3 Uppstart, sida 4
4 Under infusion, sida 5
5 Larm och felsökning, sida 6
6 Rengöring och desinfektion, sida 9
7 Underhåll och tekniska data, sida 10`),
    P(2, `
1 Avsedd användning och säkerhet

Demovia Flow 300 är avsedd för kontrollerad tillförsel av infusionsvätskor till vuxna och barn via infusionsaggregat av typen Demovia DF. Pumpen får endast användas av utbildad vårdpersonal.

VARNING: Kontrollera alltid inställd hastighet och volym mot ordinationen före start.
VARNING: Använd endast infusionsaggregat typ DF. Andra aggregat kan ge felaktig tillförsel.
VARNING: Pumpen ersätter inte tillsyn av patienten. Kontrollera infarten regelbundet enligt lokal rutin.
OBS: Pumpen får inte användas i MR-miljö eller i närheten av brandfarliga anestesigaser.`),
    P(3, `
2 Översikt

Knappar
PÅ/AV: startar och stänger av pumpen.
START/STOPP: startar eller pausar infusionen.
TYSTA LARM: tystar ljudsignalen i 2 minuter. Larmtexten står kvar på displayen.
PILKNAPPAR och OK: ändrar och bekräftar värden.
PRIMA: fyller aggregatet med vätska.

Statuslampa
Grön blinkande: infusion pågår.
Gul: larm med låg eller medelhög prioritet.
Röd: larm med hög prioritet. Infusionen har stoppats.

Luckan på pumpens framsida skyddar slangspåret, luftdetektorn och trycksensorerna.`),
    P(4, `
3 Uppstart

3.1 Före användning
Kontrollera att pumpen är rengjord, att nätkabeln är hel och att etiketten för säkerhetskontroll inte har passerat datum.

3.2 Starta pumpen
1. Anslut nätkabeln och kontrollera att nätlampan lyser.
2. Tryck på PÅ/AV i en sekund. Pumpen gör ett självtest i cirka 10 sekunder: alla lampor tänds och en ljudsignal hörs.
3. Kontrollera att displayen visar SJÄLVTEST OK.
4. Öppna luckan, lägg slangen i slangspåret uppifrån och ned och stäng luckan tills det klickar.
5. Fyll aggregatet: välj PRIMA och håll OK intryckt tills slangen är fri från luft. Aggregatet får inte vara anslutet till patienten under primning.
6. Ange hastighet (ml/h) och volym (ml) enligt ordination och bekräfta med OK.
7. Öppna rullklämman och tryck på START. Den gröna lampan blinkar under infusionen.`),
    P(5, `
4 Under infusion

4.1 Ändra hastighet
Tryck på en pilknapp, ange ny hastighet och bekräfta med OK inom 10 sekunder. Infusionen behöver inte stoppas.

4.2 Pausa
Tryck på START/STOPP. Efter 2 minuter i paus påminner pumpen med en ljudsignal.

4.3 Knapplås
Håll OK intryckt i 3 sekunder för att låsa knapparna. Lås upp på samma sätt. TYSTA LARM fungerar även när knapparna är låsta.

4.4 Batteridrift
Fulladdat batteri räcker cirka 6 timmar vid 125 ml/h. Full laddning tar 4 timmar. Låt pumpen stå ansluten till elnätet när den inte används.`),
    P(6, `
5 Larm och felsökning

Larm visas med larmkod och larmtext på displayen.

Hög prioritet: röd lampa och upprepad ljudsignal. Infusionen stoppas.
Medelhög prioritet: gul blinkande lampa. Infusionen fortsätter.
Låg prioritet: gul fast lampa.

Gör så här vid larm
1. Läs larmkod och larmtext.
2. Tryck på TYSTA LARM om ljudet behöver tystas. Ljudet återkommer efter 2 minuter om orsaken finns kvar.
3. Åtgärda orsaken enligt tabellen på sidorna 7 och 8.
4. Tryck på START för att fortsätta infusionen.`),
    P(7, `
5.1 Larmkoder

E-07 LUFT I SLANG (hög prioritet)
Orsak: Luftbubblor passerar luftdetektorn eller aggregatet är ofullständigt fyllt.
Åtgärd: 1. Stäng rullklämman. 2. Koppla bort aggregatet från patienten enligt lokal rutin och fyll om det via PRIMA. 3. Lägg tillbaka slangen, stäng luckan och tryck på START.

E-12 LUCKA ÖPPEN (hög prioritet)
Orsak: Luckan är inte helt stängd eller slangen ligger fel i spåret.
Åtgärd: Lägg slangen rakt i slangspåret och stäng luckan tills det klickar.

E-23 OCKLUSION NEDSTRÖMS (hög prioritet)
Orsak: Stängd rullklämma, vikt slang, stängd trevägskran eller tilltäppt infart mellan pumpen och patienten.
Åtgärd: 1. Tryck på TYSTA LARM. 2. Följ slangen från pumpen till patienten och kontrollera klämmor, kranar och veck. 3. Åtgärda hindret. Pumpen avlastar trycket automatiskt. 4. Tryck på START. Om larmet återkommer utan synligt hinder: avbryt infusionen och kontrollera infarten enligt lokal rutin.`),
    P(8, `
5.1 Larmkoder, fortsättning

E-24 OCKLUSION UPPSTRÖMS (hög prioritet)
Orsak: Tom behållare, oluftad glasflaska eller stängd klämma ovanför pumpen.
Åtgärd: Kontrollera behållaren, luftningen och klämman ovanför pumpen. Tryck på START.

E-31 BATTERI SVAGT (medelhög prioritet)
Orsak: Mindre än 30 minuters drifttid återstår.
Åtgärd: Anslut nätkabeln. Infusionen fortsätter.

E-32 BATTERI SLUT (hög prioritet)
Orsak: Batteriet är urladdat och pumpen har stoppat.
Åtgärd: Anslut nätkabeln omedelbart och tryck på START.

E-40 INFUSION KLAR (låg prioritet)
Orsak: Inställd volym är given. Pumpen fortsätter med håll-öppet-hastighet.
Åtgärd: Byt behållare eller avsluta infusionen enligt ordination.

E-90 till E-99 TEKNISKT FEL (hög prioritet)
Orsak: Pumpen har upptäckt ett internt fel vid självtest eller under drift.
Åtgärd: Anteckna koden, ta pumpen ur drift, märk den och kontakta medicinteknik. Starta inte om pumpen på patient.`),
    P(9, `
6 Rengöring och desinfektion

Rengör pumpen mellan varje patient och vid synlig förorening.

1. Stäng av pumpen och dra ur nätkabeln.
2. Torka alla ytor med en mjuk duk fuktad med milt rengöringsmedel.
3. Desinfektera med alkoholbaserat ytdesinfektionsmedel, högst 70 % etanol eller isopropanol.
4. Torka luckans insida och slangspåret med en fuktad bomullspinne.
5. Låt pumpen torka i minst 10 minuter med luckan öppen innan den används igen.

Använd inte klorbaserade medel på displayen, aceton eller slipande medel. Spreja aldrig direkt på pumpen. Pumpen får inte autoklaveras eller sänkas ned i vätska.`),
    P(10, `
7 Underhåll och tekniska data

Säkerhetskontroll ska utföras var 24:e månad av behörig tekniker. Batteriet byts vart tredje år.

Tekniska data
Hastighet: 0,1 till 1 200 ml/h
Noggrannhet: ± 5 %
Ocklusionstryck: tre nivåer, ställs in i servicemenyn
Vikt: 2,1 kg
Kapslingsklass: IP33

Tillverkare: Demovia Medical AB (påhittat företag)
Support: support@demovia.example`)
  ];

  /* ---------- 2. Patientmonitor (engelska) ---------- */
  const vistaPages = [
    P(1, `
Exempla Vista M5
Patient Monitor
Instructions for Use, Rev 3.2

SAMPLE MANUAL. The product and the manufacturer are fictional and the text is written for demonstration.

Contents
1 Intended use and safety, page 2
2 Overview, page 3
3 Getting started, page 4
4 Monitoring, page 5
5 Alarms, page 6
6 Cleaning and disinfection, page 9
7 Maintenance and technical data, page 10`),
    P(2, `
1 Intended use and safety

The Exempla Vista M5 is intended for monitoring ECG, SpO2, non-invasive blood pressure (NIBP) and temperature in adult and pediatric patients. It is to be used by trained healthcare staff only.

WARNING: The monitor does not replace clinical observation of the patient.
WARNING: Verify the alarm limits for every patient according to your hospital protocol.
WARNING: Do not use the monitor in an MR environment.
CAUTION: Use only Exempla accessories. Other sensors may give incorrect readings.`),
    P(3, `
2 Overview

Front panel
Power key: switches the monitor on and off.
Alarm Pause key: pauses the alarm sound for 2 minutes. The alarm message stays on the screen.
NIBP Start/Stop key: starts or stops a blood pressure measurement.
Main Menu key and rotary knob: open and navigate the menus.

Connectors are colour coded: ECG green, SpO2 blue, NIBP grey, temperature yellow.

The alarm lamp on top of the monitor flashes red for high priority alarms and yellow for medium priority alarms.`),
    P(4, `
3 Getting started

3.1 Before use
Inspect the monitor, cables and sensors for damage. Check that the battery symbol shows at least two bars if the monitor will be used on battery.

3.2 Switching on
1. Connect the power cord. The AC indicator lights green.
2. Press and hold the Power key for 2 seconds.
3. Wait for the self-test, about 20 seconds. The alarm lamp flashes red, then yellow, and a tone sounds.
4. Select New Patient or Continue Patient with the rotary knob.
5. Select the patient category: Adult or Pediatric.
6. Connect the sensors: ECG leads, SpO2 sensor and NIBP cuff.
7. Check that waveforms and values appear and that the alarm limits shown are those required by your protocol.`),
    P(5, `
4 Monitoring

4.1 NIBP
Press NIBP Start/Stop for a single measurement. Automatic intervals are set under Main Menu > NIBP > Interval.

4.2 SpO2
Place the sensor on a finger with good circulation. Do not place it on the same limb as the NIBP cuff.

4.3 Standby
Select Main Menu > Standby to pause monitoring when the patient is temporarily disconnected. Alarms are off in standby.

4.4 Battery operation
A fully charged battery lasts about 3 hours. Charging takes 5 hours with the monitor switched off.`),
    P(6, `
5 Alarms

5.1 Alarm priorities
High priority: red flashing lamp and repeated tone sequence.
Medium priority: yellow flashing lamp.
Low priority: yellow steady lamp.

Physiological alarms relate to the patient's measured values. Technical alarms relate to the monitor and its accessories and are shown with a code in the message area.

At every alarm: check the patient first. Then read the alarm message and correct the cause. Press Alarm Pause if the sound needs to be paused. The sound returns after 2 minutes if the cause remains.`),
    P(7, `
5.2 Technical alarm codes

T-101 ECG LEADS OFF (medium priority)
Cause: One or more electrodes have come loose or dried out.
Action: Check each electrode and lead wire. Replace electrodes that have dried out. Check that the trunk cable is fully inserted in the green connector.

T-110 SPO2 SENSOR OFF (medium priority)
Cause: The sensor has come off the patient or the cable is disconnected.
Action: Reattach the sensor and check the blue connector.

T-112 SPO2 LOW PERFUSION (low priority)
Cause: Weak signal, cold extremity or a sensor that sits too tight.
Action: Move the sensor to another site. Make sure it is not on the same limb as the NIBP cuff.

T-120 NIBP CUFF LEAK (medium priority)
Cause: The cuff or hose is not connected, or the cuff is leaking.
Action: Check the hose connection. Replace the cuff if it is damaged. Press NIBP Start/Stop to repeat the measurement.`),
    P(8, `
5.2 Technical alarm codes, continued

T-121 NIBP OVERPRESSURE (high priority)
Cause: The hose is kinked or the cuff is too small.
Action: The cuff deflates automatically. Remove the cuff from the patient, check the hose for kinks and select the correct cuff size before repeating the measurement.

T-130 BATTERY LOW (medium priority)
Cause: Less than 20 minutes of battery time remains.
Action: Connect the power cord.

T-201 SELF-TEST FAILED (high priority)
Cause: An internal fault was detected at start-up.
Action: Do not use the monitor. Label it and contact biomedical engineering.

T-205 SPEAKER FAULT (high priority)
Cause: The alarm speaker test failed. Alarms may be silent.
Action: Take the monitor out of use immediately and contact biomedical engineering.`),
    P(9, `
6 Cleaning and disinfection

Clean the monitor and its cables between patients.

1. Switch off the monitor and disconnect the power cord and all patient cables.
2. Wipe the housing and the screen with a soft cloth dampened with mild detergent.
3. Disinfect with 70 % isopropyl alcohol or approved quaternary ammonium wipes.
4. Wipe cables from the monitor end towards the patient end.
5. Let all parts dry completely before use.

Do not use acetone, abrasive cleaners or bleach stronger than 0.5 %. Never immerse the monitor or the sensors in liquid. Do not autoclave any part. Reusable SpO2 sensors are wiped with 70 % isopropyl alcohol.`),
    P(10, `
7 Maintenance and technical data

A safety inspection must be performed every 12 months by a qualified engineer. Replace the battery every 2 years.

Technical data
Screen: 12.1 inch colour display
Battery time: about 3 hours
Weight: 3.8 kg
Ingress protection: IPX1

Manufacturer: Exempla Care Ltd (fictional company)
Support: service@exempla.example`)
  ];

  /* ---------- 3. Sug (svenska) ---------- */
  const vacPages = [
    P(1, `
Modellia Vac 20
Mobil sugenhet
Bruksanvisning, Utgåva 2

EXEMPELMANUAL. Produkten och tillverkaren är påhittade och texten är skriven för demonstration.

Innehåll
1 Avsedd användning och säkerhet, sida 2
2 Översikt, sida 3
3 Uppstart och funktionskontroll, sida 4
4 Användning, sida 5
5 Felsökning och felkoder, sida 6
6 Rengöring och desinfektion, sida 7
7 Underhåll och tekniska data, sida 8`),
    P(2, `
1 Avsedd användning och säkerhet

Modellia Vac 20 är en mobil sugenhet för sugning av sekret från luftvägarna. Enheten får endast användas av utbildad vårdpersonal.

VARNING: Använd alltid bakteriefilter mellan uppsamlingskärlet och pumpen.
VARNING: Använd inte enheten i närheten av brandfarliga gaser eller vätskor.
OBS: Sugstyrkan ställs in enligt lokal rutin. Bruksanvisningen anger inga kliniska rekommendationer.`),
    P(3, `
2 Översikt

Strömbrytare med grön driftlampa.
Vakuumregulator: vred som ställer in sugstyrkan.
Manometer: visar aktuellt vakuum i kPa.
Uppsamlingskärl 1 000 ml med lock och flottör som stänger suget när kärlet är fullt.
Bakteriefilter: sitter mellan kärlets port märkt VAKUUM och pumpen.
Patientslang: ansluts till porten märkt PATIENT.
Statuslampa: gul eller röd lampa tillsammans med felkod på displayen.`),
    P(4, `
3 Uppstart och funktionskontroll

Gör funktionskontrollen före varje användning och efter rengöring.

1. Kontrollera att uppsamlingskärlet är tomt och helt och att locket sitter tätt.
2. Kontrollera att bakteriefiltret är torrt och sitter mellan kärlet och pumpen.
3. Anslut patientslangen till porten märkt PATIENT.
4. Slå på strömbrytaren. Den gröna lampan tänds.
5. Täpp till patientslangen med tummen och vrid regulatorn till max. Manometern ska nå minst 75 kPa inom 10 sekunder.
6. Ställ in sugstyrkan med regulatorn enligt lokal rutin.
7. Anslut sugkatetern.

Når manometern inte 75 kPa: se felkod F1 på sidan 6.`),
    P(5, `
4 Användning

Byt uppsamlingskärl när nivån når markeringen 800 ml. Om kärlet blir fullt stänger flottören suget och felkod F3 visas.

Batteridrift
Fulladdat batteri räcker cirka 45 minuter. Full laddning tar 6 timmar. Förvara enheten ansluten till laddaren så att den alltid är klar att använda.

Efter användning
Stäng av enheten, kassera engångsartiklar och rengör enligt avsnitt 6.`),
    P(6, `
5 Felsökning och felkoder

F1 LÅGT VAKUUM (gul lampa)
Orsak: Läckage vid lock, slang eller kärl, eller felmonterat filter.
Åtgärd: 1. Tryck fast locket. 2. Kontrollera att slangarna sitter på rätt port. 3. Gör om funktionskontrollen enligt avsnitt 3.

F2 FILTER BLOCKERAT (gul lampa)
Orsak: Bakteriefiltret är fuktigt eller igensatt.
Åtgärd: Byt bakteriefilter. Ett fuktigt filter får aldrig återanvändas.

F3 KÄRL FULLT (gul lampa)
Orsak: Flottören har stängt suget.
Åtgärd: Stäng av enheten, byt uppsamlingskärl, kontrollera filtret och starta igen.

F4 BATTERI SVAGT (gul blinkande lampa)
Orsak: Mindre än 10 minuters drifttid återstår.
Åtgärd: Anslut laddaren. Enheten kan användas under laddning.

F5 MOTORFEL (röd lampa)
Orsak: Motorn är överhettad eller vätska har nått pumpen.
Åtgärd: Stäng av enheten omedelbart, använd reservsug, märk enheten och kontakta medicinteknik. Starta inte om enheten.`),
    P(7, `
6 Rengöring och desinfektion

1. Stäng av enheten och dra ur laddaren.
2. Kassera engångskärl, patientslang och sugkateter.
3. Byt bakteriefilter efter varje patient och alltid om det har blivit fuktigt.
4. Torka höljet med ytdesinfektionsmedel, alkohol 70 % eller oxiderande medel.
5. Flergångskärl töms och körs i diskdesinfektor, 90 °C.
6. Låt alla delar torka och gör funktionskontrollen enligt avsnitt 3.

Spola aldrig vätska in i pumpen. Enheten får inte sänkas ned i vätska.`),
    P(8, `
7 Underhåll och tekniska data

Service ska utföras var 12:e månad av behörig tekniker.

Tekniska data
Maximalt vakuum: 85 kPa
Flöde: 26 liter per minut
Vikt: 4,6 kg
Batteritid: cirka 45 minuter

Tillverkare: Modellia Medical AB (påhittat företag)
Support: service@modellia.example`)
  ];

  /* ---------- 4. Diatermi (engelska) ---------- */
  const arcPages = [
    P(1, `
Fikta Arc 200
Electrosurgical Unit
User Manual, Edition B

SAMPLE MANUAL. The product and the manufacturer are fictional and the text is written for demonstration.

Contents
1 Intended use and safety, page 2
2 Overview, page 3
3 Set-up and start, page 4
4 During use, page 5

6 Cleaning and disinfection, page 8
7 Maintenance and technical data, page 9`),
    P(2, `
1 Intended use and safety

The Fikta Arc 200 is an electrosurgical unit for cutting and coagulation of tissue during surgery. It is to be used by trained operating room staff only.

WARNING: Risk of fire. Do not activate the unit in the presence of flammable skin preparations that have not dried, or in oxygen-enriched atmospheres.
WARNING: Always use a split neutral electrode with monopolar modes. Apply it according to the electrode's own instructions.
WARNING: For patients with pacemakers or other active implants, follow your hospital protocol.
CAUTION: Power settings are selected as instructed by the surgeon. This manual gives no clinical recommendations.`),
    P(3, `
2 Overview

Front panel
Mains switch.
CUT display with up and down keys, and mode keys Pure Cut and Blend.
COAG display with up and down keys, and mode keys Soft Coag and Forced Coag.
Monopolar sockets 1 and 2.
Bipolar socket.
Neutral electrode socket with REM indicator: green when contact is approved, red when contact is insufficient.

Rear panel
Footswitch connectors, volume control and mains inlet.`),
    P(4, `
3 Set-up and start

1. Place the unit on its trolley with the ventilation openings unobstructed and connect the mains cable.
2. Switch on the mains switch. The self-test takes about 8 seconds. All displays light up and PASS is shown.
3. Apply the split neutral electrode to the patient and connect it. The REM indicator must turn green.
4. Connect the handpiece to monopolar socket 1, or the forceps to the bipolar socket.
5. Connect the footswitch if one is used.
6. Select mode and power settings as instructed by the surgeon.
7. Check that the activation tone is clearly audible. Adjust the volume on the rear panel.`),

4 During use

5 Error messages

Errors are shown as Err and a number in the CUT display.

Err 11 NEUTRAL ELECTRODE (red REM indicator, output blocked)
Cause: The neutral electrode is not connected, has poor skin contact or the cable is damaged.
Action: 1. Check the plug in the neutral electrode socket. 2. Check that the whole electrode surface adheres to the skin. Replace the electrode if it has lifted. Do not reposition a used electrode. 3. Wait for the green REM indicator.

Err 20 ACTIVATION AT POWER-ON
Cause: A handpiece key or the footswitch was pressed during the self-test, or a key is stuck.
Action: Release all keys and restart the unit. Replace the handpiece if the error returns.

Err 22 ACTIVATION TIMEOUT
Cause: Continuous activation for more than 60 seconds.

Err 31 OVERTEMPERATURE

/* ----- Lagring: riktig databas när den finns, annars minne för den här visningen ----- */
const MEM = new Map();
const TOMB = '__lotsa_deleted__';
const liveColl = new Map();
const watchers = new Set();
let dataRev = 0;
const memoStore = new Map();
function memo(key, fn) {
  const m = memoStore.get(key);
  if (m && m.rev === dataRev) return m.v;
  const v = fn();
  memoStore.set(key, { rev: dataRev, v });
  return v;
}
const splitPath = path => { const p = path.split('/'); return { coll: p.slice(0, -1).join('/'), id: p[p.length - 1] }; };
function mergedColl(coll) {
  const out = new Map(liveColl.get(coll) || []);
  for (const [path, v] of MEM) {
    const c = splitPath(path);
    if (c.coll !== coll) continue;
    if (v === TOMB) out.delete(c.id); else out.set(c.id, v);
  }
  return out;
}
let emitQueued = false;
function emit() {
  dataRev++;
  if (emitQueued) return;
  emitQueued = true;
  requestAnimationFrame(() => { emitQueued = false; watchers.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); });
}
function demote(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') { toast('Lagringen är full. Ta bort äldre manualer eller data och försök igen.', 'crit'); return false; }
  const perm = ['not_granted', 'revoked', 'capability_disabled', 'capability_removed'].includes(code) || (code === 'invalid_argument' && S.canWrite !== true);
  if (!perm) return false;
  if (!S.readOnly) {
    S.readOnly = true;
    toast('Den här visningen kan inte spara. Det du gör finns kvar tills sidan stängs.');
    emit();
  }
  return true;
}
const store = {
  useLive() { return S.live && !S.readOnly; },
  async set(path, data) {
    data = clone(data);
    if (this.useLive()) {
      try { await S.caps.db.doc(path).set(data); return; }
      catch (e) { if (!demote(e)) throw e; }
    }
    MEM.set(path, data); emit();
  },
  /* Sammanfogar fält. Skapar dokumentet om det saknas. */
  async update(path, data) {
    data = clone(data);
    if (this.useLive()) {
      try { await S.caps.db.doc(path).update(data); return; }
      catch (e) {
        if (e && e.code === 'invalid_argument') {
          let exists = null;
          try { exists = (await S.caps.db.doc(path).get()).exists; } catch (e1) { exists = null; }
          if (exists === false) {
            try { await S.caps.db.doc(path).set(data); return; }
            catch (e2) { if (!demote(e2)) throw e2; }
          } else if (!demote(e)) throw e;
        } else if (!demote(e)) throw e;
      }
    }
    const cur = MEM.has(path) && MEM.get(path) !== TOMB ? MEM.get(path) : await this.get(path);
    MEM.set(path, deepMerge(cur || {}, data)); emit();
  },
  async del(path) {
    if (this.useLive()) {
      try { await S.caps.db.doc(path).delete(); return; }
      catch (e) { if (!demote(e)) throw e; }
    }
    MEM.set(path, TOMB); emit();
  },
  async get(path) {
    if (MEM.has(path)) { const v = MEM.get(path); return v === TOMB ? null : v; }
    const c = splitPath(path), lc = liveColl.get(c.coll);
    if (lc && lc.has(c.id)) return lc.get(c.id);
    if (S.live && !lc) {
      try { const s = await S.caps.db.doc(path).get(); return s.exists ? s.data() : null; } catch (e) { return null; }
    }
    return null;
  },
  async list(coll) {
    const m = new Map();
    if (S.live) {
      try { const qs = await S.caps.db.collection(coll).get(); qs.docs.forEach(d => m.set(d.id, d.data())); } catch (e) { /* visa det som finns */ }
    }
    for (const [path, v] of MEM) {
      const c = splitPath(path);
      if (c.coll !== coll) continue;
      if (v === TOMB) m.delete(c.id); else m.set(c.id, v);
    }
    return m;
  }
};

async function writeParts(manualId, pages, rev) {
  const parts = [];

  for (const p of pages) {
    const bytes = new Blob([JSON.stringify(p)]).size + 2;
    if (cur.length && size + bytes > 170000) { parts.push(cur); cur = []; size = 0; }
    cur.push(p.text.length > 60000 ? { ...p, text: p.text.slice(0, 60000) } : p);
    size += bytes;
  }
  if (cur.length) parts.push(cur);
  for (let i = 0; i < parts.length; i++) await store.set(`manuals/${manualId}/parts/${rev}-${i}`, { rev, i, pages: parts[i] });
  return parts.length;
}

const STOP = new Set(('och att det som en är på av för med den till inte har de om ett jag man kan ska vi så var hur vad när där eller men från ' +
  'vid under efter innan min mitt din sig sin detta denna dessa också bara mycket göra gör blir bli får finns enligt ' +
  'the and is of to in for with on at by an be are was it that this as or if not from can may must should will when how what do does you your').split(' '));
const SUFFIX = ['ningarna', 'ningar', 'ningen', 'ning', 'heten', 'erna', 'arna', 'orna', 'ande', 'ende', 'aren', 'ade', 'are', 'ar', 'er', 'or', 'en', 'et', 'na', 'ing', 'ed', 'es', 'ly', 'a', 'e', 's', 't', 'n'];
function stem(t) {
  if (t.length < 5 || /\d/.test(t)) return t;
  for (const s of SUFFIX) if (t.length - s.length >= 4 && t.endsWith(s)) return t.slice(0, -s.length);
  return t;
}
function terms(text) {
  const out = [];
  const toks = String(text || '').toLowerCase().normalize('NFKC').match(/[a-zåäöéüæø0-9]+(?:-[a-zåäöéüæø0-9]+)*/g) || [];
  for (const tok of toks) {
    if (tok.includes('-')) {
      out.push(tok.replace(/-/g, ''));
      for (const p of tok.split('-')) if (p.length > 1 && !STOP.has(p)) out.push(stem(p));
    } else if (tok.length > 1 && !STOP.has(tok)) out.push(stem(tok));
  }
  return out;
}
const indexCache = new Map();
function pageIndex(m, pages) {
  const key = m.id + ':' + (m.uploadedAt || 0) + ':' + pages.length;
  if (indexCache.has(key)) return indexCache.get(key);
  const docs = pages.map(p => {
    const tf = new Map(), ts = terms(p.text);
    ts.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
    return { n: p.n, tf, len: ts.length || 1 };
  });
  const df = new Map();
  docs.forEach(d => d.tf.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1)));
  const idx = { docs, df, avg: sum(docs.map(d => d.len)) / (docs.length || 1) };
  indexCache.set(key, idx);
  return idx;
}
/* BM25 över sidor. Sidan är enheten eftersom källhänvisningen ska peka på en sida. */
function rankPages(idx, qTerms) {
  const N = idx.docs.length, uniq = [...new Set(qTerms)], k1 = 1.4, b = 0.75;
  return idx.docs.map(d => {
    let s = 0;
    for (const t of uniq) {
      const f = d.tf.get(t);
      if (!f) continue;
      const idf = Math.log(1 + (N - (idx.df.get(t) || 0) + 0.5) / ((idx.df.get(t) || 0) + 0.5));
      s += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * d.len / idx.avg));
    }
    return { n: d.n, score: s };
  }).filter(x => x.score > 0).sort((a, b2) => b2.score - a.score);
}
function detectLang(text) {
  const t = ' ' + String(text || '').toLowerCase().slice(0, 20000) + ' ';
  const count = ws => ws.reduce((s, w) => s + (t.split(' ' + w + ' ').length - 1), 0);
  const sv = count(['och', 'att', 'är', 'för', 'med', 'som', 'inte', 'ska', 'eller', 'vid']);
  const en = count(['the', 'and', 'is', 'of', 'to', 'for', 'with', 'not', 'or', 'be']);

  return sv >= en ? 'sv' : 'en';
}

function findPNR(text) {
  const hits = [];
  const re = /(^|\D)((?:19|20)?\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01]|6[1-9]|[78]\d|9[01])[-+ ]?(\d{4})(?!\d)/g;

function partialField(rawText, key) {

async function lookupAlarm(input, deviceId, { signal } = {}) {

  const targets = (deviceId ? [deviceById(deviceId)].filter(Boolean) : devices()).filter(d => manualFor(d));
  const results = [];

    if (hit) results.push({ device: d, manual: m, key: hit.key, entry: hit.entry, source: 'register' });
  }

  for (const d of targets) {
    const m = manualFor(d), pages = await pagesOf(m);
    const ps = pages.filter(p => re.test(p.text));
    if (ps.length) textHits.push({ device: d, manual: m, pages: ps.slice(0, 4) });
  }
  if (!textHits.length) return { canon, results: [], notFound: true, targets };
  if (!aiReady()) return { canon, results: [], textHits, targets };
  let error = null;
  for (const h of textHits.slice(0, 3)) {
    try {
      const entry = await alarmFromPages(h, input.trim(), signal);
      if (!entry) continue;
      results.push({ device: h.device, manual: h.manual, key: entry.kod, entry, source: 'ai' });
      if (entry.verified) saveDoc('manuals', h.manual.id, { alarms: { [entry.kod.replace(/[./]/g, '-')]: entry } }).catch(() => {});
    } catch (e) { error = e; if (e && e.code === 'cancelled') throw e; break; }
  }
  if (!results.length) return { canon, results: [], textHits, targets, error };
  return { canon, results, targets };
}

      <section class="qsec"><h3>${icon('spray')}Rengöring</h3>${card.rengoring.steg.length ? html`<ol>${card.rengoring.steg.map(s => html`<li>${s}</li>`)}</ol>` : html`<p class="muted small">Manualen saknar avsnitt om rengöring.</p>`}${cardSrc(m, card.rengoring, 'rengoring')}</section>

INPUT.manualSearch = debounce(async el => {
  const d = deviceById(el.dataset.id), m = manualFor(d), out = $('#msOut-' + el.dataset.id), q = el.value.trim();
  if (!out || !m) return;
  if (q.length < 2) { setHTML(out, ''); return; }
  const pages = await pagesOf(m), low = q.toLowerCase();
  let hits = pages.map(p => { const i = p.text.toLowerCase().indexOf(low); return i >= 0 ? { p, range: { start: i, end: i + q.length } } : null; }).filter(Boolean);
  if (!hits.length) {
    const words = terms(q);
    hits = rankPages(pageIndex(m, pages), words).slice(0, 6).map(r => {
      const p = pages.find(x => x.n === r.n), lowp = p.text.toLowerCase();
      let range = null;
      for (const w of words) { const i = lowp.indexOf(w); if (i >= 0) { let e = i; while (e < p.text.length && /[\p{L}\p{N}-]/u.test(p.text[e])) e++; range = { start: i, end: e }; break; } }
      return { p, range };
    });
  }
  setHTML(out, hits.length ? html`<p class="small muted">${hits.length} ${hits.length === 1 ? 'sida' : 'sidor'} med träff</p>${hits.slice(0, 10).map(h => html`<button class="fallback-hit" data-act="openPage" data-m="${m.id}" data-p="${h.p.n}" data-s="${h.range ? h.range.start : ''}" data-e="${h.range ? h.range.end : ''}"><strong>Sida ${h.p.n}</strong><span>${snippetAround(h.p.text, h.range, 220)}</span></button>`)}` : html`<p class="muted">Inga träffar på ”${q}”.</p>`);
}, 160);
