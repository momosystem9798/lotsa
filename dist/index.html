function askNote({ title, label, placeholder = '', ok = 'Spara', required = false }) {
  return new Promise(resolve => {
    let done = false;
    const m = modal(html`<form><div class="modal-h"><h2 class="h2">${title}</h2></div>
      <div class="modal-b"><div class="field"><label for="noteTxt">${label}</label><textarea class="textarea" id="noteTxt" maxlength="500" placeholder="${placeholder}" ${required ? 'required' : ''} autofocus></textarea></div></div>
      <div class="modal-f"><button type="button" class="btn" data-x="no">Avbryt</button><button class="btn btn-primary">${ok}</button></div></form>`, { onClose: () => { if (!done) resolve(null); } });
    const f = $('form', m.body);
    f.addEventListener('submit', e => {
      e.preventDefault(); e.stopPropagation();
      const v = $('#noteTxt', f).value.trim();
      if (findPNR(v).length) { toast('Texten ser ut att innehålla ett personnummer. Ta bort det.', 'crit'); return; }
      done = true; m.close(); resolve(v);
    });
    f.addEventListener('click', e => { if (e.target.closest('[data-x="no"]')) { done = true; m.close(); resolve(null); } });
  });
}

ACT.flagResolve = async el => {

  const f = flags().find(x => x.id === el.dataset.id);

  await saveDoc('flags', f.id, { status: 'resolved', resolution: note, decidedAt: Date.now(), decidedBy: S.uid || '' });
  audit('flag', f.deviceId, 'Flaggat svar åtgärdat av ansvarig.' + (note ? ' ' + note : ''));
  toast('Flaggan är åtgärdad.');
};

  const note = await askNote({ title: 'Avsluta felanmälan', label: 'Åtgärd', placeholder: 'Till exempel: enheten hämtad för service, lånepump utlämnad.' });
  if (note === null) return;
  const r = reports().find(x => x.id === el.dataset.id);
  if (!r) return;
  await saveDoc('reports', r.id, { status: 'closed', resolution: note, decidedAt: Date.now(), decidedBy: S.uid || '' });

ACT.gapTip = async el => {
  const d = deviceById(el.dataset.dev);
  if (!d) { toast('Frågan är inte kopplad till en enhet.'); return; }
  const text = await askNote({ title: 'Svara med ett lokalt tips', label: `Fråga: ${el.dataset.q}`, placeholder: 'Skriv den lokala rutinen eller var svaret finns. Tipset märks som ej från tillverkaren.', ok: 'Publicera tipset', required: true });

  await addDoc('tips', { deviceId: d.id, text, status: 'approved', by: S.uid || '', createdAt: Date.now(), decidedAt: Date.now(), fromQuestion: el.dataset.q });
  if (el.dataset.key) await saveSettings({ gapsDone: { [el.dataset.key]: Date.now() } });
  audit('tip', d.id, 'Lokalt tips publicerat som svar på en obesvarad fråga.');

};

async function loadLib(name) {
  let i = 0;
  for (const src of LIBS[name]) {
    try { await loadScript(src); return i; } catch (e) { i++; }
  }
  throw new Error('Biblioteket ' + name + ' kunde inte laddas');
}

/* ----- PDF till text ----- */
async function loadPdfJs() {
  const i = await loadLib('pdf');
  const lib = window.pdfjsLib;
  if (!lib) throw new Error('pdf.js saknas');
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker[Math.min(i, 1)];
  return lib;
}
function textFromItems(items) {
  let out = '', lastY = null;
  for (const it of items) {
    if (typeof it.str !== 'string') continue;
    const y = it.transform ? it.transform[5] : null;
    if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && !out.endsWith('\n')) out += '\n';
    out += it.str;
    if (it.hasEOL) { out += '\n'; lastY = null; } else if (y !== null) lastY = y;
  }
  return out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]{2,}/g, ' ').trim();
}
/* Öppnar PDF:en i en bakgrundstråd. Svarar den inte körs tolkningen i sidans egen tråd i stället. */
let pdfMainThread = false;
async function openPdfDoc(lib, bytes) {
  const open = () => lib.getDocument({ data: bytes.slice(), isEvalSupported: false });
  if (!pdfMainThread && !window.pdfjsWorker) {
    const task = open();
    let timer;
    try {
      return await Promise.race([task.promise, new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('pdf-worker-timeout')), 15000); })]);
    } catch (e) {
      if (e && /Password|InvalidPDF|MissingPDF/.test(e.name || '')) throw e;
      try { task.destroy(); } catch (e2) { /* redan avslutad */ }
      pdfMainThread = true;
      await loadScript(lib.GlobalWorkerOptions.workerSrc);
    } finally { clearTimeout(timer); }
  }
  return open().promise;
}
async function extractPdf(file, onProgress, signal) {
  const lib = await loadPdfJs();
  const doc = await openPdfDoc(lib, new Uint8Array(await file.arrayBuffer()));
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    if (signal && signal.aborted) { doc.destroy(); throw { code: 'cancelled' }; }
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    pages.push({ n: i, text: textFromItems(tc.items) });
    page.cleanup();
    onProgress(i, doc.numPages);
    if (i % 3 === 0) await sleep(0);
  }
  return { doc, pages };
}
async function renderPageBlob(doc, n) {
  const page = await doc.getPage(n), v1 = page.getViewport({ scale: 1 });
  const scale = Math.min(3, Math.sqrt(1500000 / (v1.width * v1.height)));
  const vp = page.getViewport({ scale }), c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  c.width = c.height = 0;
  return blob;
}
function splitText(text) {
  const chunks = text.includes('\f') ? text.split('\f') : [];
  if (!chunks.length) {
    let cur = '';
    for (const para of text.replace(/\r/g, '').split(/\n{2,}/)) {
      if (cur.length + para.length > 2800 && cur) { chunks.push(cur); cur = ''; }
      cur += (cur ? '\n\n' : '') + para;
    }
    if (cur) chunks.push(cur);
  }
  return chunks.map((t, i) => ({ n: i + 1, text: t.trim() })).filter(p => p.text);
}
function guessVersion(pages) {
  const t = pages.slice(0, 3).map(p => p.text).join('\n') + '\n' + (pages.length ? pages[pages.length - 1].text : '');
  const v = t.match(/\b(Rev(?:ision)?\.?\s?[A-Z0-9][A-Z0-9.-]{0,6}|Version\s?\d+(?:\.\d+)*|Utgåva\s?\d+|Edition\s?[A-Z0-9]+|Issue\s?\d+)\b/i);
  const d = t.match(/\b(20\d{2})[-/.](0[1-9]|1[0-2])(?:[-/.](0[1-9]|[12]\d|3[01]))?\b/);
  return { version: v ? v[1].trim() : '', issued: d ? `${d[1]}-${d[2]}-${d[3] || '01'}` : '' };
}

async function qrMatrix(text) {
  await loadLib('qr');
  const q = window.qrcode(0, 'M');
  q.addData(text); q.make();

}
async function drawQR(d) {
  const el = document.getElementById('qr-' + d.id), url = deviceUrl(d);
  if (!el) return;
  if (!url) { setHTML(el, html`<span class="small muted">Adress saknas</span>`); return; }
  try {
    const q = await qrMatrix(url);
    let p = '';
    for (let r = 0; r < q.n; r++) for (let c = 0; c < q.n; c++) if (q.dark(r, c)) p += `M${c},${r}h1v1h-1z`;
    if (el.isConnected) setHTML(el, raw(`<svg viewBox="0 0 ${q.n} ${q.n}" shape-rendering="crispEdges" role="img" aria-label="QR-kod till ${esc(d.name)}"><path d="${p}" fill="#000"/></svg>`));
  } catch (e) { setHTML(el, html`<span class="small muted">QR-koden kunde inte ritas. Kontrollera nätverket.</span>`); }
}
ACT.scanQR = () => {
  let inp = $('#scanInput');

    inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'scanInput'; inp.className = 'sr'; inp.tabIndex = -1;
    inp.setAttribute('capture', 'environment'); inp.setAttribute('aria-hidden', 'true');

async function decodeQR(file) {
  toast('Läser QR-koden');
  try {
    const bmp = await createImageBitmap(file);
    let text = '';
    if ('BarcodeDetector' in window) {
      try { const r = await new window.BarcodeDetector({ formats: ['qr_code'] }).detect(bmp); if (r.length) text = r[0].rawValue; } catch (e) { /* prova nästa metod */ }
    }
    if (!text) {
      await loadLib('jsqr');
      for (const side of [1400, 800]) {
        const k = Math.min(1, side / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        const ctx = c.getContext('2d');
        ctx.drawImage(bmp, 0, 0, c.width, c.height);
        const r = window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
        if (r && r.data) { text = r.data; break; }
      }
    }
    if (!text) { toast('Ingen QR-kod hittades i bilden. Fota etiketten rakt framifrån och försök igen.', 'crit'); return; }
    const m = text.match(/#enhet-([a-z0-9-]+)/i);
    if (m && deviceById(m[1])) location.hash = '#enhet-' + m[1];
    else toast(m ? 'QR-koden pekar på en enhet som inte finns här.' : 'QR-koden hör inte till den här appen.', 'crit');
  } catch (e) { console.warn('QR:', e); toast('Bilden kunde inte läsas. Försök igen.', 'crit'); }
}

async function saveFile(filename, data, fallback) {
  const dl = S.caps.downloads;
  if (!dl) {
    if (fallback) fallback(); else toast('Nedladdning är inte tillgänglig i den här visningen. Öppna appen i en webbläsare på datorn.', 'crit');
    return false;
  }
  try { await dl.save({ filename, data }); toast('Filen är sparad.'); return true; }
  catch (e) {
    const c = e && e.code;
    if (c === 'declined') return false;
    if (c === 'rate_limited') toast('En nedladdning väntar redan. Försök igen om en stund.');
    else if (c === 'rejected_extension' || c === 'extension_not_enabled') toast('Filformatet kan inte laddas ner i den här visningen.', 'crit');
    else {
      if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) S.caps.downloads = null;
      if (fallback) fallback(); else toast('Nedladdningen gick inte att genomföra här.', 'crit');
    }
    return false;
  }
}

let tourBusy = false;
async function tourGo(i) {

  if (i < 0) return;
  tourBusy = true;
  TOUR.i = i;
  const s = TOUR_STEPS[i], role = s.role || 'staff';
  if (S.prefs.role !== role) S.prefs.role = role;
  if (s.pre) s.pre();
  if (location.hash !== s.route) { location.hash = s.route; await waitRoute(); }
  else { render(); }

  if (!TOUR.on) { tourBusy = false; return; }

  const pw = TOUR.pop.offsetWidth, ph = TOUR.pop.offsetHeight;

  setHTML($('#topbarRight'), html`<button class="btn btn-s" data-act="tour" aria-label="Starta rundturen">${icon('play', 'ic-s')}Rundtur</button>`);
  const tabs = [['hem', 'Hem', 'home'], ['enheter', 'Utrustning', 'grid'], ['fraga', 'Fråga', 'chat'], ['larm', 'Larmkod', 'bell']];
  setHTML($('#tabbar'), html`${tabs.map(([k, l, ic]) => html`<a href="#${k}" class="${cur === k ? 'is-on' : ''}">${icon(ic)}${l}</a>`)}<button data-act="more" class="${tabs.some(t => t[0] === cur) ? '' : 'is-on'}">${icon('menu')}Mer</button>`);
  let b = '';
  if (S.ready) {
    if (S.slow) b = 'Lagringen svarar inte ännu. Exempeldatan visas, men sparade manualer och tips kan saknas tills den svarar.';
    else if (!S.live) b = 'Den här visningen har ingen lagring. Det du lägger till finns kvar tills sidan stängs.';
    else if (S.readOnly) b = 'Skrivskyddad visning. Det du lägger till finns kvar tills sidan stängs.';
  }
  const keyBtn = STANDALONE && S.ready && !b && !STANDALONE.hasKey() && !S.prefs.keyBannerHidden;
  if (keyBtn) b = 'AI-svar är avstängda tills en API-nyckel för Claude läggs in. Manualer, larmkoder och snabbkort fungerar ändå.';
  setHTML($('#banner'), b ? html`<div class="banner" role="status">${icon('info')}<span>${b}</span>${keyBtn ? html`<button class="btn btn-s" data-act="apiKey">Lägg in nyckel</button><button class="btn btn-s btn-quiet" data-act="hideKeyBanner">Inte nu</button>` : ''}</div>` : '');
}

/* ----- Fristående läge: API-nyckel för AI-svar ----- */
ACT.apiKey = () => {
  if (!STANDALONE) return;
  const has = STANDALONE.hasKey();
  modal(html`<form data-form="apiKey">
    <div class="modal-h"><h2 class="h2">API-nyckel för AI-svar</h2><button type="button" class="btn btn-icon btn-quiet" data-act="closeOverlay" aria-label="Stäng">${icon('x')}</button></div>
    <div class="modal-b">
      <p>Utanför Claude hämtar ${BRAND} sina AI-svar direkt från Anthropic API. Skapa en nyckel i Claude Console (console.anthropic.com) och klistra in den här.</p>
      <p class="hint mt8">Nyckeln sparas bara i den här webbläsaren och skickas bara till Anthropic. Varje person och dator behöver en egen. Använd en nyckel med en låg kostnadsgräns och lägg inte in den på delade datorer.</p>
      <div class="field mt14"><label for="akKey">API-nyckel</label><input class="input" id="akKey" name="key" type="password" autocomplete="off" spellcheck="false" placeholder="${has ? STANDALONE.keyHint() : 'sk-ant-...'}"></div>
    </div>
    <div class="modal-f">${has ? html`<button type="button" class="btn btn-danger" data-act="apiKeyClear">Ta bort nyckeln</button>` : ''}<button type="button" class="btn" data-act="closeOverlay">Avbryt</button><button class="btn btn-primary">Spara</button></div>
  </form>`);
};
function applyKey() {
  S.caps.sample = STANDALONE.hasKey() ? STANDALONE.sample : null;
  S.aiOff = false; S.aiNote = '';
  closeAllOverlays(); render();
}
FORM.apiKey = f => {
  const key = String(formData(f).key || '').trim();
  if (!key) { toast('Klistra in nyckeln först.', 'crit'); return; }
  if (!/^sk-ant-/.test(key)) { toast('Det ser inte ut som en API-nyckel från Anthropic. Den börjar med sk-ant-.', 'crit'); return; }
  if (!STANDALONE.setKey(key)) { toast('Nyckeln kunde inte sparas i den här webbläsaren.', 'crit'); return; }
  applyKey(); toast('Nyckeln är sparad. AI-svar är påslagna.');
};
ACT.apiKeyClear = () => { STANDALONE.setKey(''); applyKey(); toast('Nyckeln är borttagen.'); };
ACT.hideKeyBanner = () => { S.prefs.keyBannerHidden = true; savePrefs(); render(); };
function render() {
  drawShell();
  const el = $('#view');
  if (!S.ready) setHTML(el, html`<div class="skel" style="height:54px;max-width:420px"></div><div class="skel mt20" style="height:66px"></div><div class="skel mt14" style="height:180px"></div>`);
  else curView.render(el, ROUTE);
  document.dispatchEvent(new CustomEvent('lotsa:route'));
}
function route() {
  const r = parseHash(), prev = ROUTE.name;
  if (curView && curView.leave && entered === prev && prev !== r.name) { curView.leave(); entered = ''; }
  Object.assign(ROUTE, r);
  closeAllOverlays();
  vizTip.hide();
  curView = V[r.name];
  if (curView.enter && entered !== r.name) { curView.enter(); entered = r.name; }
  render();
  const main = $('#main');
  if (main) main.scrollTop = 0;
}
window.addEventListener('hashchange', route);

ACT.role = el => {
  const role = el.dataset.role === 'admin' ? 'admin' : 'staff';
  if (S.prefs.role === role) return;
  S.prefs.role = role; savePrefs();
  closeAllOverlays();
  toast(role === 'admin' ? 'Du ser nu appen som ansvarig.' : 'Du ser nu appen som personal.');
  if (role === 'staff' && ADMIN_ROUTES.includes(ROUTE.name)) location.hash = '#hem'; else render();
};
ACT.more = () => {
  const admin = isAdmin(), todo = admin ? todoCount() : 0, cur = ROUTE.name;
  const w = document.createElement('div');
  setHTML(w, html`<div class="drawer-scrim" data-act="closeOverlay"></div><div class="sheet" role="dialog" aria-label="Mer">
    <nav class="nav">${navLinks([NAV_STAFF[4]], cur)}${admin ? html`<div class="nav-group">Ansvarig</div>${navLinks(NAV_ADMIN, cur, { granska: todo })}` : ''}
      <div class="nav-group">${BRAND}</div><button data-act="tour">${icon('play')}Rundtur</button><a href="#om">${icon('info')}Om ${BRAND}</a></nav>
    <div class="role" style="margin-top:12px"><span class="role-label">Visa appen som</span>${roleSeg(admin)}</div></div>`);
  openOverlay(w);
};

watchers.add(() => {
  if (!S.ready) return;
  drawShell();
  if (curView && curView.update) curView.update();
});

(async function init() {
  hydrateDemo();
  curView = V[parseHash().name];
  route();
  await initCaps();
  await loadPrefs();
  startData(() => { route(); });
})();

})();
</script>
</body>
</html>
